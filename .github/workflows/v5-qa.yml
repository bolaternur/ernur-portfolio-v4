name: V5 QA

on:
  push:
    branches: [v5-rebuild]
  pull_request:
    branches: [main]

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check v5.js

      - name: Required page tree
        shell: python
        run: |
          from pathlib import Path
          required = [
              'index.html',
              'work/index.html',
              'work/tracelab/index.html',
              'work/decode/index.html',
              'work/3209/index.html',
              'work/fusion360/index.html',
              'work/web/index.html',
              'about/index.html',
              'lab/index.html',
              'contact/index.html',
              '404.html',
              'v5.css',
              'v5.js',
              'setup-assets.ps1',
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))
          print('Required V5 page tree: OK')

      - name: Localhost route smoke
        run: |
          python3 -m http.server 8080 >/tmp/ernur-v5-http.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          for route in / /work/ /work/tracelab/ /work/decode/ /work/3209/ /work/fusion360/ /work/web/ /about/ /lab/ /contact/ /404.html; do
            curl --fail --silent --show-error "http://127.0.0.1:8080${route}" >/dev/null
          done
          kill $SERVER_PID
          echo "Localhost route smoke: OK"
