name: Portfolio QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check portfolio.js
          node --check model-viewer.js
          node --check immersive.js
          node --check scripts/build.mjs
          node --check scripts/serve.mjs
      - name: Verify routes and production assets
        run: npm test
      - name: Build clean site
        run: npm run build
      - name: Localhost route smoke
        run: |
          PORT=8080 node scripts/serve.mjs dist > /tmp/ernur-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          for route in / /work/ /work/tracelab/ /work/decode/ /work/3209/ /work/fusion360/ /work/web/ /about/ /lab/ /contact/ /404.html; do
            curl --fail --silent --show-error "http://127.0.0.1:8080${route}" > /dev/null
          done
